<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYNKODE - Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { dark: '#1E1B4B', primary: '#6D28D9', accent: '#4C1D95', light: '#F8FAFC' }
                    }
                }
            }
        }
    </script>
    <style>.glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }</style>
</head>
<body class="bg-brand-light text-slate-800 font-sans antialiased flex h-screen overflow-hidden">

    <aside id="sidebar" class="bg-brand-dark text-white w-64 flex flex-col fixed lg:static h-full transition-transform transform -translate-x-full lg:translate-x-0 z-50">
        <div class="p-6 flex items-center justify-between"><h1 class="text-xl font-bold tracking-wider">KYNKODE</h1></div>
        <nav class="flex-1 px-4 space-y-2 mt-4 overflow-y-auto">
            <a href="index.html" class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:text-white hover:bg-white/10 rounded-lg"><i class="fa-solid fa-house w-5"></i><span class="text-sm font-medium">Dashboard</span></a>
            <a href="kynflow.html" class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:text-white hover:bg-white/10 rounded-lg"><i class="fa-solid fa-clipboard-check w-5"></i><span class="text-sm font-medium">Flow</span></a>
            <a href="tasks.html" class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:text-white hover:bg-white/10 rounded-lg"><i class="fa-solid fa-list-check w-5"></i><span class="text-sm font-medium">Tasks</span></a>
            <a href="workflows.html" class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:text-white hover:bg-white/10 rounded-lg"><i class="fa-solid fa-network-wired w-5"></i><span class="text-sm font-medium">Workflows</span></a>
            <a href="calendar.html" class="flex items-center gap-3 px-4 py-3 bg-brand-primary text-white rounded-lg shadow-md"><i class="fa-regular fa-calendar w-5"></i><span class="text-sm font-medium">Calendar</span></a>
            <a href="reportsflow.html" class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:text-white hover:bg-white/10 rounded-lg"><i class="fa-solid fa-chart-pie w-5"></i><span class="text-sm font-medium">Reports</span></a>
            <a href="settingsflow.html" class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:text-white hover:bg-white/10 rounded-lg"><i class="fa-solid fa-gear w-5"></i><span class="text-sm font-medium">Settings</span></a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-y-auto relative pt-16 lg:pt-0">
        <div class="p-6 lg:p-10 max-w-7xl mx-auto w-full pb-32">
            <header class="flex items-center justify-between mb-8">
                <div class="flex items-center gap-4">
                    <div class="bg-brand-primary text-white p-3 rounded-2xl shadow-sm"><i class="fa-regular fa-calendar text-3xl"></i></div>
                    <div>
                        <h1 class="text-3xl font-bold text-brand-dark">Clinical Schedule</h1>
                        <p class="text-slate-500 text-sm mt-1 font-medium">Appointments, surgeries, and task due dates</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button class="px-4 py-2 bg-white border border-slate-200 rounded-xl text-xs font-semibold text-slate-700">Today</button>
                    <button class="px-4 py-2 bg-brand-primary text-white rounded-xl text-xs font-semibold">September 2026</button>
                </div>
            </header>

            <!-- Calendar View Grid -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
                <div class="grid grid-cols-7 gap-2 text-center text-xs font-bold text-slate-400 mb-4 uppercase">
                    <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
                </div>
                <div class="grid grid-cols-7 gap-2 h-96">
                    <div class="border border-slate-100 rounded-xl p-2 bg-slate-50/50 text-xs text-slate-400">31</div>
                    <div class="border border-slate-100 rounded-xl p-2 text-xs text-slate-700 font-bold">1</div>
                    <div class="border border-slate-100 rounded-xl p-2 text-xs text-slate-700 font-bold">2</div>
                    <div class="border border-slate-100 rounded-xl p-2 text-xs text-slate-700 font-bold">3</div>
                    <div class="border border-purple-200 bg-purple-50/40 rounded-xl p-2 text-xs font-bold text-brand-primary">
                        4
                        <div class="mt-2 bg-brand-primary text-white text-[10px] p-1 rounded font-normal truncate">Lab call - Thor</div>
                        <div class="mt-1 bg-amber-500 text-white text-[10px] p-1 rounded font-normal truncate">Post-op IV Fluids</div>
                    </div>
                    <div class="border border-slate-100 rounded-xl p-2 text-xs text-slate-700 font-bold">5</div>
                    <div class="border border-slate-100 rounded-xl p-2 text-xs text-slate-700 font-bold">6</div>
                </div>
            </div>
        </div>
    </main>

    <!-- AI Floating Bar -->
    <div class="fixed bottom-4 left-0 right-0 px-4 pointer-events-none flex flex-col items-center z-50">
        <div class="w-full max-w-2xl glass-panel shadow-lg rounded-full p-2 flex items-center gap-2 border border-white pointer-events-auto">
            <button class="h-10 w-10 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center"><i class="fa-solid fa-microphone"></i></button>
            <input type="text" placeholder="Ask KYNKODE AI (e.g. 'Schedule follow-up appointment for Friday')" class="flex-1 bg-transparent border-none text-sm px-2 text-slate-700 outline-none">
            <button class="h-10 w-10 rounded-full bg-brand-primary text-white flex items-center justify-center"><i class="fa-solid fa-paper-plane text-sm"></i></button>
        </div>
    </div>
</body>
</html>
