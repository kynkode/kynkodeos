<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYNKODE - Reports</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { dark: '#1E1B4B', primary: '#6D28D9', accent: '#4C1D95', light: '#F8FAFC' } }
                }
            }
        }
    </script>
    <style>.glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }</style>
</head>
<body class="bg-brand-light text-slate-800 font-sans antialiased flex h-screen overflow-hidden">

    <aside id="sidebar" class="bg-brand-dark text-white w-64 flex flex-col fixed lg:static h-full z-50">
        <div class="p-6 flex items-center justify-between"><h1 class="text-xl font-bold tracking-wider">KYNKODE</h1></div>
        <nav class="flex-1 px-4 space-y-2 mt-4 overflow-y-auto">
            <a href="index.html" class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:text-white"><i class="fa-solid fa-house w-5"></i><span class="text-sm font-medium">Dashboard</span></a>
            <a href="kynflow.html" class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:text-white"><i class="fa-solid fa-clipboard-check w-5"></i><span class="text-sm font-medium">Flow</span></a>
            <a href="tasks.html" class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:text-white"><i class="fa-solid fa-list-check w-5"></i><span class="text-sm font-medium">Tasks</span></a>
            <a href="workflows.html" class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:text-white"><i class="fa-solid fa-network-wired w-5"></i><span class="text-sm font-medium">Workflows</span></a>
            <a href="calendar.html" class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:text-white"><i class="fa-regular fa-calendar w-5"></i><span class="text-sm font-medium">Calendar</span></a>
            <a href="reportsflow.html" class="flex items-center gap-3 px-4 py-3 bg-brand-primary text-white rounded-lg shadow-md"><i class="fa-solid fa-chart-pie w-5"></i><span class="text-sm font-medium">Reports</span></a>
            <a href="settingsflow.html" class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:text-white"><i class="fa-solid fa-gear w-5"></i><span class="text-sm font-medium">Settings</span></a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-y-auto relative pt-16 lg:pt-0">
        <div class="p-6 lg:p-10 max-w-7xl mx-auto w-full pb-32">
            <header class="flex items-center justify-between mb-8">
                <div class="flex items-center gap-4">
                    <div class="bg-brand-primary text-white p-3 rounded-2xl shadow-sm"><i class="fa-solid fa-chart-pie text-3xl"></i></div>
                    <div>
                        <h1 class="text-3xl font-bold text-brand-dark">Operational Reports</h1>
                        <p class="text-slate-500 text-sm mt-1 font-medium">Throughput, task velocity, and accountability metrics</p>
                    </div>
                </div>
                <button class="bg-white border border-slate-200 text-slate-700 px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-download"></i> Export CSV
                </button>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                    <span class="text-xs font-semibold text-slate-400">Completion Rate</span>
                    <div class="text-3xl font-bold text-emerald-600 mt-2">94.2%</div>
                    <p class="text-xs text-slate-500 mt-1">+2.4% from last week</p>
                </div>
                <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                    <span class="text-xs font-semibold text-slate-400">Avg Task Turnaround</span>
                    <div class="text-3xl font-bold text-slate-800 mt-2">1.8 hrs</div>
                    <p class="text-xs text-slate-500 mt-1">Target: &lt; 2.5 hrs</p>
                </div>
                <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                    <span class="text-xs font-semibold text-slate-400">Workflow Bottlenecks</span>
                    <div class="text-3xl font-bold text-amber-500 mt-2">1 Track</div>
                    <p class="text-xs text-slate-500 mt-1">Pet Relocation customs clearance</p>
                </div>
            </div>
        </div>
    </main>

    <!-- AI Floating Bar -->
    <div class="fixed bottom-4 left-0 right-0 px-4 pointer-events-none flex flex-col items-center z-50">
        <div class="w-full max-w-2xl glass-panel shadow-lg rounded-full p-2 flex items-center gap-2 border border-white pointer-events-auto">
            <button class="h-10 w-10 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center"><i class="fa-solid fa-microphone"></i></button>
            <input type="text" placeholder="Ask KYNKODE AI (e.g. 'Generate weekly task completion summary')" class="flex-1 bg-transparent border-none text-sm px-2 text-slate-700 outline-none">
            <button class="h-10 w-10 rounded-full bg-brand-primary text-white flex items-center justify-center"><i class="fa-solid fa-paper-plane text-sm"></i></button>
        </div>
    </div>
</body>
</html>
