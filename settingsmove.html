<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - KYNKODE AGI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --bg-color: #fff9f5; --sidebar-bg: #4a2311; --sidebar-hover: #5c2d16; --primary-orange: #f06522; --text-dark: #1f2937; --text-gray: #6b7280; --border-color: #f3f4f6; --card-bg: #ffffff; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-color); display: flex; height: 100vh; overflow: hidden; }
    .sidebar { width: 260px; background-color: var(--sidebar-bg); color: white; display: flex; flex-direction: column; z-index: 99; }
    .sidebar-header { padding: 30px 20px; font-size: 1.25rem; font-weight: 700; letter-spacing: 1px; }
    .nav-menu { flex: 1; display: flex; flex-direction: column; gap: 5px; padding: 0 10px; }
    .nav-item { display: flex; align-items: center; gap: 15px; padding: 12px 20px; color: #d1d5db; text-decoration: none; border-radius: 8px; font-weight: 500; transition: all 0.2s; }
    .nav-item:hover { background-color: var(--sidebar-hover); color: white; }
    .nav-item.active { background-color: var(--primary-orange); color: white; }
    .sidebar-footer { padding: 20px; }
    .active-cases-widget { background-color: #8c421b; padding: 15px; border-radius: 12px; }
    .active-cases-widget span { display: block; font-size: 0.85rem; color: #fca5a5; }
    .active-cases-widget h2 { font-size: 2rem; margin-top: 5px; }
    .main-content { flex: 1; padding: 40px; overflow-y: auto; padding-bottom: 120px; }
    .top-header { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; }
    .app-icon { background-color: var(--primary-orange); color: white; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 1.5rem; }
    .app-title h1 { color: var(--primary-orange); font-size: 1.8rem; }
    .app-title p { color: var(--text-gray); font-size: 0.9rem; }
    
    .card { background: var(--card-bg); border-radius: 12px; padding: 25px; border: 1px solid var(--border-color); max-width: 600px; margin-bottom: 25px;}
    .card-header { font-weight: 600; margin-bottom: 20px; font-size: 1.1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;}
    
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.9rem; color: var(--text-dark); margin-bottom: 8px; font-weight: 500; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.9rem; outline: none; }
    .form-group input:focus { border-color: var(--primary-orange); }
    .btn-save { background: var(--primary-orange); color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 500; cursor: pointer; }
    
    .floating-ai-bar { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 700px; background: white; border-radius: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; align-items: center; padding: 8px 15px; border: 1px solid var(--primary-orange); z-index: 1000; }
    .floating-ai-bar input { flex: 1; border: none; outline: none; padding: 12px 15px; font-size: 1rem; }
    .ai-btn { background: none; border: none; color: var(--text-gray); font-size: 1.2rem; cursor: pointer; padding: 10px; }
    .ai-btn.send-btn { color: var(--primary-orange); background: #fff5ee; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;}
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">KYNKODE</div>
    <nav class="nav-menu">
      <a href="index.html" class="nav-item"><i class="fas fa-home w-5 text-center"></i> Dashboard</a>
      <a href="kynmove.html" class="nav-item"><i class="fas fa-plane w-5 text-center"></i> Relocations</a>
      <a href="documentsmove.html" class="nav-item"><i class="fas fa-file-alt w-5 text-center"></i> Documents</a>
      <a href="checklistsmove.html" class="nav-item"><i class="fas fa-check-square w-5 text-center"></i> Checklists</a>
      <a href="templatesmove.html" class="nav-item"><i class="fas fa-layer-group w-5 text-center"></i> Templates</a>
      <a href="reportsmove.html" class="nav-item"><i class="fas fa-chart-bar w-5 text-center"></i> Reports</a>
      <a href="settingsmove.html" class="nav-item active"><i class="fas fa-cog w-5 text-center"></i> Settings</a>
    </nav>
    <div class="sidebar-footer"><div class="active-cases-widget"><span>Active Cases</span><h2>7</h2></div></div>
  </aside>
  <main class="main-content">
    <div class="top-header">
      <div class="app-icon"><i class="fas fa-cog"></i></div>
      <div class="app-title"><h1>Settings</h1><p>System configurations and preferences</p></div>
    </div>
    
    <div class="card">
      <div class="card-header">Profile Details</div>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" value="System Admin">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" value="admin@kynkode.com">
      </div>
      <div class="form-group">
        <label>Timezone</label>
        <select>
          <option>East Africa Time (EAT)</option>
          <option>GMT</option>
          <option>EST</option>
        </select>
      </div>
      <button class="btn-save">Save Changes</button>
    </div>
  </main>
  <div class="floating-ai-bar">
    <button class="ai-btn"><i class="fas fa-microphone"></i></button>
    <input type="text" placeholder="Ask AI to change system notification settings...">
    <button class="ai-btn send-btn"><i class="fas fa-paper-plane"></i></button>
  </div>
</body>
</html>
